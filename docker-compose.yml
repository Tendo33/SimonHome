# 生产：拉 CI 推到 GHCR 的镜像，服务器上不构建。
#   docker compose pull && docker compose up -d
# 固定或回滚版本：IMAGE_TAG=sha-xxxxxxx（或 1.2.3）docker compose up -d
#
# 本地自己构建时叠加 override：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  web:
    image: ghcr.io/tendo33/simonhome:${IMAGE_TAG:-latest}
    ports:
      - "8443:80"
    restart: unless-stopped
